<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120">
  <defs>
    <linearGradient id="grad-bt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2090ff"/>
      <stop offset="100%" stop-color="#14d49a"/>
    </linearGradient>
    <linearGradient id="grad-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2090ff"/>
      <stop offset="100%" stop-color="#14d49a"/>
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@800&amp;display=swap');
    </style>
  </defs>

  <!-- Hexagon icon -->
  <g transform="translate(48, 42)">
    <!-- Hexagon outline -->
    <polygon points="0,-36 31.2,-18 31.2,18 0,36 -31.2,18 -31.2,-18"
             fill="none" stroke="url(#grad-bt)" stroke-width="2.8" stroke-linejoin="round"/>
    <!-- Neural network nodes and connections -->
    <!-- Node positions: top-right, center-left, bottom-right -->
    <line x1="-12" y1="-2" x2="10" y2="-16" stroke="url(#grad-bt)" stroke-width="2" stroke-linecap="round"/>
    <line x1="-12" y1="-2" x2="10" y2="14" stroke="url(#grad-bt)" stroke-width="2" stroke-linecap="round"/>
    <line x1="10" y1="-16" x2="10" y2="14" stroke="url(#grad-bt)" stroke-width="2" stroke-linecap="round"/>
    <!-- Nodes -->
    <circle cx="-12" cy="-2" r="4.5" fill="url(#grad-bt)"/>
    <circle cx="10" cy="-16" r="4.5" fill="url(#grad-bt)"/>
    <circle cx="10" cy="14" r="4.5" fill="url(#grad-bt)"/>
  </g>

  <!-- CortX wordmark -->
  <text x="92" y="56" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="52" letter-spacing="-1">
    <tspan fill="#c8d8ea">Cort</tspan><tspan fill="url(#grad-bt)">X</tspan>
  </text>

  <!-- Gradient divider line -->
  <line x1="92" y1="68" x2="290" y2="68" stroke="url(#grad-line)" stroke-width="1.2" opacity="0.5"/>

  <!-- Tagline -->
  <text x="92" y="85" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="600"
        font-size="11" fill="#5a7aaa" letter-spacing="3.5">LEARN SMARTER. PASS FASTER.</text>

  <!-- Byline -->
  <text x="92" y="103" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-weight="400"
        font-size="10.5" fill="#5a7aaa" opacity="0.7" letter-spacing="0.5">by Proxura</text>
</svg>
